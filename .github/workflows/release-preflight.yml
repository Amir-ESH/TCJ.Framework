name: Release preflight

on:
  workflow_dispatch:
    inputs:
      package_id_policy:
        description: Expected NuGet.org state for the package IDs
        required: true
        type: choice
        default: existing
        options:
          - available
          - existing
          - report-only

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  sqlserver-integration:
    name: SQL Server integration gate
    uses: ./.github/workflows/sqlserver-integration.yml

  preflight:
    needs: sqlserver-integration
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Require the main branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release preflight must run from main. Selected ref: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore repository tools
        run: dotnet tool restore

      - name: Verify release metadata
        run: python3 eng/verify-release.py --require-ready

      - name: Verify dependency security policy
        run: python3 eng/verify-dependency-security.py

      - name: Verify release integrity automation
        run: python3 eng/release-integrity.py validate-config

      - name: Verify code coverage policy
        run: python3 eng/verify-coverage.py validate-config

      - name: Verify architecture policy
        run: python3 eng/verify-architecture-policy.py validate-config

      - name: Verify SBOM configuration
        run: python3 eng/verify-sbom.py validate-config

      - name: Validate reproducibility policy
        run: python3 eng/verify-reproducible-build.py validate-config

      - name: Validate documentation policy
        run: python3 eng/verify-documentation.py validate-config

      - name: Check NuGet package IDs
        run: >
          python3 eng/check-nuget-package-ids.py
          --policy "${{ inputs.package_id_policy }}"

      - name: Read release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("eng/release-manifest.json"))["version"])')"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore and audit dependencies
        run: dotnet restore TCJ.slnx

      - name: Build solution
        run: >
          dotnet build TCJ.slnx
          --configuration Release
          --no-restore

      - name: Generate release-candidate API metadata
        run: >
          dotnet docfx metadata docfx/docfx.json
          --noRestore
          --warningsAsErrors
          --property "Version=${{ steps.release-version.outputs.value }};RepositoryCommit=${{ github.sha }}"

      - name: Build release-candidate documentation site
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dotnet docfx build docfx/docfx.json \
            --warningsAsErrors \
            --metadata "packageVersion=${{ steps.release-version.outputs.value }}" \
            --metadata "sourceCommit=${{ github.sha }}" \
            --metadata "releaseTag=preflight-${{ github.sha }}" \
            --metadata "documentationBuildDate=$build_date"

      - name: Verify release-candidate documentation
        run: >
          python3 eng/verify-documentation.py verify
          --configuration Release
          --build-root src
          --api-root artifacts/documentation/api
          --output artifacts/documentation
          --version "${{ steps.release-version.outputs.value }}"
          --commit-sha "${{ github.sha }}"
          --release-tag "preflight-${{ github.sha }}"

      - name: Archive release-candidate documentation site
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/documentation
          zip -qr "TCJ.Framework.Documentation.${{ steps.release-version.outputs.value }}.zip" site

      - name: Publish documentation summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/documentation/DOCUMENTATION_SUMMARY.md ]]; then
            cat artifacts/documentation/DOCUMENTATION_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload documentation-site artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site-${{ github.run_id }}
          path: |
            artifacts/documentation/site/**
            artifacts/documentation/api/**
            artifacts/documentation/DOCUMENTATION_SUMMARY.md
            artifacts/documentation/documentation-summary.json
            artifacts/documentation/missing-documentation.json
            artifacts/documentation/broken-links.json
            artifacts/documentation/TCJ.Framework.Documentation.*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Run tests
        run: >
          dotnet test TCJ.slnx
          --configuration Release
          --no-build
          --filter "Category!=SqlServer"
          --collect:"XPlat Code Coverage"
          --settings tests/coverlet.runsettings
          --logger "trx;LogFileName=preflight-test-results.trx"
          --results-directory TestResults

      - name: Generate architecture-test summary
        run: >
          python3 eng/verify-architecture-policy.py write-summary
          --output artifacts/architecture/ARCHITECTURE_TEST_SUMMARY.md

      - name: Publish architecture-test summary
        shell: bash
        run: cat artifacts/architecture/ARCHITECTURE_TEST_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce code coverage quality gate
        run: >
          python3 eng/verify-coverage.py verify
          --summary artifacts/coverage/COVERAGE_SUMMARY.md
          --json artifacts/coverage/coverage-summary.json

      - name: Publish code coverage summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/coverage/COVERAGE_SUMMARY.md ]]; then
            cat artifacts/coverage/COVERAGE_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean previous reproducibility outputs
        run: rm -rf artifacts/reproducibility artifacts/packages

      - name: Run isolated Build A
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/artifacts/reproducibility/build-a"
          dotnet restore TCJ.slnx \
            --force-evaluate \
            --artifacts-path "$root" \
            -p:ContinuousIntegrationBuild=true \
            -p:ReproducibleBuildRoot="$root" \
            -p:RepositoryCommit="$GITHUB_SHA"
          dotnet build TCJ.slnx \
            --configuration Release \
            --no-restore \
            --artifacts-path "$root" \
            -p:Version="${{ steps.release-version.outputs.value }}" \
            -p:ContinuousIntegrationBuild=true \
            -p:ReproducibleBuildRoot="$root" \
            -p:RepositoryCommit="$GITHUB_SHA"

      - name: Pack Build A
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/artifacts/reproducibility/build-a"
          mkdir -p "$root/packages"
          dotnet pack TCJ.slnx \
            --configuration Release \
            --no-build \
            --no-restore \
            --artifacts-path "$root" \
            -p:PackageOutputPath="$root/packages" \
            -p:Version="${{ steps.release-version.outputs.value }}" \
            -p:ContinuousIntegrationBuild=true \
            -p:ReproducibleBuildRoot="$root" \
            -p:RepositoryCommit="$GITHUB_SHA"

      - name: Run isolated Build B
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/artifacts/reproducibility/build-b"
          dotnet restore TCJ.slnx \
            --force-evaluate \
            --artifacts-path "$root" \
            -p:ContinuousIntegrationBuild=true \
            -p:ReproducibleBuildRoot="$root" \
            -p:RepositoryCommit="$GITHUB_SHA"
          dotnet build TCJ.slnx \
            --configuration Release \
            --no-restore \
            --artifacts-path "$root" \
            -p:Version="${{ steps.release-version.outputs.value }}" \
            -p:ContinuousIntegrationBuild=true \
            -p:ReproducibleBuildRoot="$root" \
            -p:RepositoryCommit="$GITHUB_SHA"

      - name: Pack Build B
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/artifacts/reproducibility/build-b"
          mkdir -p "$root/packages"
          dotnet pack TCJ.slnx \
            --configuration Release \
            --no-build \
            --no-restore \
            --artifacts-path "$root" \
            -p:PackageOutputPath="$root/packages" \
            -p:Version="${{ steps.release-version.outputs.value }}" \
            -p:ContinuousIntegrationBuild=true \
            -p:ReproducibleBuildRoot="$root" \
            -p:RepositoryCommit="$GITHUB_SHA"

      - name: Compare reproducible release candidate builds
        run: >
          python3 eng/verify-reproducible-build.py compare
          --version "${{ steps.release-version.outputs.value }}"
          --build-a artifacts/reproducibility/build-a/packages
          --build-b artifacts/reproducibility/build-b/packages
          --output artifacts/reproducibility/report

      - name: Publish reproducibility summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/reproducibility/report/REPRODUCIBILITY_SUMMARY.md ]]; then
            cat artifacts/reproducibility/report/REPRODUCIBILITY_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reproducibility reports and package builds
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-reproducibility-${{ github.run_id }}
          path: |
            artifacts/reproducibility/build-a/packages/*
            artifacts/reproducibility/build-b/packages/*
            artifacts/reproducibility/report/REPRODUCIBILITY_SUMMARY.md
            artifacts/reproducibility/report/reproducibility-summary.json
            artifacts/reproducibility/report/differences/*
          if-no-files-found: warn
          retention-days: 30

      - name: Promote verified Build A
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/packages
          mkdir -p artifacts/packages
          cp artifacts/reproducibility/build-a/packages/* artifacts/packages/

      - name: Verify package set
        shell: bash
        run: |
          set -euo pipefail

          version="$(python3 -c 'import json; print(json.load(open("eng/release-manifest.json"))["version"])')"
          bash eng/verify-packages.sh "$version"

      - name: Inspect package metadata and contents
        run: >
          python3 eng/verify-release.py
          --package-directory artifacts/packages

      - name: Generate release SBOM
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("eng/release-manifest.json"))["version"])')"
          tag="$(python3 -c 'import json; print(json.load(open("eng/release-manifest.json"))["tag"])')"
          python3 eng/generate-sbom.py \
            --version "$version" \
            --package-directory artifacts/packages \
            --output artifacts/sbom \
            --commit-sha "$GITHUB_SHA" \
            --release-tag "$tag"

      - name: Verify release SBOM
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("eng/release-manifest.json"))["version"])')"
          python3 eng/verify-sbom.py verify \
            --version "$version" \
            --package-directory artifacts/packages \
            --sbom "artifacts/sbom/TCJ.Framework.$version.cdx.json" \
            --summary artifacts/sbom/SBOM_SUMMARY.md \
            --json artifacts/sbom/sbom-summary.json

      - name: Publish SBOM summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/sbom/SBOM_SUMMARY.md ]]; then
            cat artifacts/sbom/SBOM_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## SBOM" >> "$GITHUB_STEP_SUMMARY"
            echo "SBOM generation or verification did not complete. Inspect the first failed SBOM step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create release notes preview
        shell: bash
        run: |
          set -euo pipefail

          version="$(python3 -c 'import json; print(json.load(open("eng/release-manifest.json"))["version"])')"
          python3 eng/extract-release-notes.py \
            --version "$version" \
            --output artifacts/release/RELEASE_NOTES.md

      - name: Generate release candidate checksums
        shell: bash
        run: |
          set -euo pipefail

          version="$(python3 -c 'import json; print(json.load(open("eng/release-manifest.json"))["version"])')"
          python3 eng/release-integrity.py write \
            --version "$version" \
            --package-directory artifacts/packages \
            --sbom "artifacts/sbom/TCJ.Framework.$version.cdx.json" \
            --checksums artifacts/release/SHA256SUMS

      - name: Verify release candidate checksums
        shell: bash
        run: |
          set -euo pipefail

          version="$(python3 -c 'import json; print(json.load(open("eng/release-manifest.json"))["version"])')"
          python3 eng/release-integrity.py verify \
            --version "$version" \
            --package-directory artifacts/packages \
            --sbom "artifacts/sbom/TCJ.Framework.$version.cdx.json" \
            --checksums artifacts/release/SHA256SUMS

      - name: Upload preflight SBOM reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-sbom-${{ github.run_id }}
          path: |
            artifacts/sbom/*.cdx.json
            artifacts/sbom/SBOM_SUMMARY.md
            artifacts/sbom/sbom-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload preflight test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-test-results-${{ github.run_id }}
          path: |
            TestResults/**/*.trx
            artifacts/architecture/ARCHITECTURE_TEST_SUMMARY.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-coverage-${{ github.run_id }}
          path: |
            TestResults/**/coverage.cobertura.xml
            artifacts/coverage/COVERAGE_SUMMARY.md
            artifacts/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.run_id }}
          path: |
            artifacts/packages/*
            artifacts/sbom/*.cdx.json
            artifacts/sbom/SBOM_SUMMARY.md
            artifacts/sbom/sbom-summary.json
            artifacts/release/RELEASE_NOTES.md
            artifacts/release/SHA256SUMS
            eng/release-manifest.json
          if-no-files-found: error
          retention-days: 30
