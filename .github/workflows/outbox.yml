name: Transactional outbox

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 4"
  push:
    branches: [main, develop]
    paths:
      - "src/TCJ.Core/**"
      - "src/TCJ.EntityFrameworkCore/**"
      - "src/TCJ.EntityFrameworkCore.SqlServer/**"
      - "src/TCJ.AspNetCore/**"
      - "tests/TCJ.Outbox.Tests/**"
      - "eng/outbox-*.json"
      - "eng/verify-outbox.py"
      - "docs/outbox.md"
      - ".github/workflows/outbox.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-preflight.yml"
      - ".github/workflows/release.yml"
      - "Directory.Packages.props"
      - "TCJ.slnx"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/TCJ.Core/**"
      - "src/TCJ.EntityFrameworkCore/**"
      - "src/TCJ.EntityFrameworkCore.SqlServer/**"
      - "src/TCJ.AspNetCore/**"
      - "tests/TCJ.Outbox.Tests/**"
      - "eng/outbox-*.json"
      - "eng/verify-outbox.py"
      - "docs/outbox.md"
      - ".github/workflows/outbox.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-preflight.yml"
      - ".github/workflows/release.yml"
      - "Directory.Packages.props"
      - "TCJ.slnx"

permissions:
  contents: read

concurrency:
  group: outbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  persistence:
    name: Validate persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate automation scripts
        run: |
          python3 -m py_compile eng/*.py
          python3 -m unittest discover --start-directory eng/tests --pattern "test_*.py"
      - name: Validate outbox policy and contract
        run: python3 eng/verify-outbox.py validate-config
      - name: Restore and audit dependencies
        run: dotnet restore tests/TCJ.Outbox.Tests/TCJ.Outbox.Tests.csproj --force-evaluate
      - name: Build outbox tests
        run: dotnet build tests/TCJ.Outbox.Tests/TCJ.Outbox.Tests.csproj -c Release --no-restore
      - name: Start SQL Server Testcontainer and run transactional persistence tests
        run: >
          dotnet test tests/TCJ.Outbox.Tests/TCJ.Outbox.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=outbox-full.trx"
          --results-directory TestResults/Outbox/full
      - name: Run retry, dead-letter, crash recovery, lease expiration, cleanup, telemetry, health and sensitive-data verification
        run: >
          python3 eng/verify-outbox.py verify
          --results TestResults/Outbox/full
          --output artifacts/outbox
      - name: Generate outbox summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/outbox/OUTBOX_SUMMARY.md ]]; then
            cat artifacts/outbox/OUTBOX_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test results and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outbox-full-${{ github.run_id }}
          path: |
            TestResults/Outbox/**
            artifacts/outbox/**
          if-no-files-found: warn
          retention-days: 30

  concurrency:
    name: Validate concurrent processing
    needs: persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate outbox policy and contract
        run: python3 eng/verify-outbox.py validate-config
      - name: Restore and audit dependencies
        run: dotnet restore tests/TCJ.Outbox.Tests/TCJ.Outbox.Tests.csproj --force-evaluate
      - name: Build outbox tests
        run: dotnet build tests/TCJ.Outbox.Tests/TCJ.Outbox.Tests.csproj -c Release --no-restore
      - name: Run concurrent processor and lease-recovery tests
        run: >
          dotnet test tests/TCJ.Outbox.Tests/TCJ.Outbox.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~Concurrent_processors|FullyQualifiedName~Expired_lease|FullyQualifiedName~Cancellation_after_handler"
          --logger "trx;LogFileName=outbox-concurrency.trx"
          --results-directory TestResults/Outbox/concurrency
      - name: Upload concurrent processing results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outbox-concurrency-${{ github.run_id }}
          path: TestResults/Outbox/concurrency/**
          if-no-files-found: error
          retention-days: 30

  retry-recovery:
    name: Validate retry and recovery
    needs: persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate outbox policy and contract
        run: python3 eng/verify-outbox.py validate-config
      - name: Restore and audit dependencies
        run: dotnet restore tests/TCJ.Outbox.Tests/TCJ.Outbox.Tests.csproj --force-evaluate
      - name: Build outbox tests
        run: dotnet build tests/TCJ.Outbox.Tests/TCJ.Outbox.Tests.csproj -c Release --no-restore
      - name: Run retry, poison-message, replay and cleanup tests
        run: >
          dotnet test tests/TCJ.Outbox.Tests/TCJ.Outbox.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~Transient_failure|FullyQualifiedName~Poison_message|FullyQualifiedName~Permanent_failure|FullyQualifiedName~Replay|FullyQualifiedName~Cleanup|FullyQualifiedName~Sensitive_payload"
          --logger "trx;LogFileName=outbox-recovery.trx"
          --results-directory TestResults/Outbox/recovery
      - name: Upload retry and recovery results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outbox-recovery-${{ github.run_id }}
          path: TestResults/Outbox/recovery/**
          if-no-files-found: error
          retention-days: 30
