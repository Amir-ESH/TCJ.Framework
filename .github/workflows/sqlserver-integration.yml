name: SQL Server integration

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/TCJ.Core/**"
      - "compatibility/Consumers/EntityFrameworkCore.Console/**"
      - "compatibility/Consumers/EntityFrameworkCore.SqlServer.Console/**"
      - "compatibility/Consumers/FullStack.MinimalApi/**"
      - "compatibility/Directory.Build.props"
      - "compatibility/Directory.Packages.props"
      - "compatibility/NuGet.Config"
      - "compatibility/NuGet.Published.Config"
      - "upgrade-tests/Scenarios/EntityFrameworkCoreConsumer/**"
      - "upgrade-tests/Scenarios/EntityFrameworkCore.SqlServerConsumer/**"
      - "upgrade-tests/Scenarios/FullStackConsumer/**"
      - "upgrade-tests/Directory.Build.props"
      - "upgrade-tests/Directory.Packages.props"
      - "upgrade-tests/NuGet.Baseline.Config"
      - "upgrade-tests/NuGet.Target.Config"
      - "eng/upgrade-compatibility-policy.json"
      - "eng/breaking-changes.json"
      - "src/TCJ.DependencyInjection/**"
      - "src/TCJ.EntityFrameworkCore/**"
      - "src/TCJ.EntityFrameworkCore.SqlServer/**"
      - "tests/TCJ.EntityFrameworkCore.SqlServer.IntegrationTests/**"
      - "tests/TCJ.Resilience.Tests/**"
      - "eng/resilience-policy.json"
      - "eng/resilience-contract.json"
      - "eng/verify-resilience.py"
      - "eng/sqlserver-integration-policy.json"
      - "eng/verify-sqlserver-integration.py"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.Config"
      - "global.json"
      - ".github/workflows/sqlserver-integration.yml"

  workflow_dispatch:

  workflow_call:

  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  TCJ_SQLSERVER_RESULTS_DIR: TestResults/SqlServerIntegration

concurrency:
  group: sqlserver-integration-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlserver-integration:
    name: Run database tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Display Docker information
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults/SqlServerIntegration/diagnostics
          docker version | tee TestResults/SqlServerIntegration/diagnostics/docker-version.txt
          docker info

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Display sanitized environment summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_os=${RUNNER_OS}"
            echo "dotnet_sdk=$(dotnet --version)"
            echo "source_commit=${GITHUB_SHA}"
            python3 - <<'PY'
          import json
          policy = json.load(open("eng/sqlserver-integration-policy.json", encoding="utf-8"))
          print(f"container_image={policy['containerImage']}")
          PY
          } | tee TestResults/SqlServerIntegration/diagnostics/environment-summary.txt

      - name: Validate automation scripts
        run: |
          python3 -m py_compile eng/*.py
          python3 -m unittest eng.tests.test_verify_sqlserver_integration

      - name: Validate SQL Server integration policy
        run: python3 eng/verify-sqlserver-integration.py validate-config

      - name: Validate health-check configuration
        run: python3 eng/verify-health-checks.py validate-config

      - name: Validate resilience policy
        run: python3 eng/verify-resilience.py validate-config

      - name: Restore and audit dependencies
        run: >
          dotnet restore
          tests/TCJ.EntityFrameworkCore.SqlServer.IntegrationTests/TCJ.EntityFrameworkCore.SqlServer.IntegrationTests.csproj
          --force-evaluate

      - name: Build integration-test project
        run: >
          dotnet build
          tests/TCJ.EntityFrameworkCore.SqlServer.IntegrationTests/TCJ.EntityFrameworkCore.SqlServer.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Restore and build SQL Server resilience tests
        run: |
          dotnet restore tests/TCJ.Resilience.Tests/TCJ.Resilience.Tests.csproj --force-evaluate
          dotnet build tests/TCJ.Resilience.Tests/TCJ.Resilience.Tests.csproj --configuration Release --no-restore

      - name: Run SQL Server integration tests
        id: integration-tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet test \
            tests/TCJ.EntityFrameworkCore.SqlServer.IntegrationTests/TCJ.EntityFrameworkCore.SqlServer.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --filter "Category=SqlServer" \
            --logger "trx;LogFileName=sqlserver-integration.trx" \
            --results-directory TestResults/SqlServerIntegration \
            2>&1 | sed -E 's/(Password|Pwd)[[:space:]]*=[^;[:space:]]+/\1=<redacted>/Ig; s/Tcj!aA1_[A-F0-9]{20,}/<redacted>/g' \
            | tee TestResults/SqlServerIntegration/diagnostics/test-host.log

      - name: Run SQL Server resilience fault-injection scenarios
        env:
          TCJ_RESILIENCE_TRACE_DIR: artifacts/resilience/sqlserver-traces
        run: >
          dotnet test tests/TCJ.Resilience.Tests/TCJ.Resilience.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category=SqlServer"
          --logger "trx;LogFileName=resilience-sqlserver.trx"
          --results-directory TestResults/ResilienceSqlServer

      - name: Verify test results and minimum test count
        id: verify-results
        if: always()
        continue-on-error: true
        run: >
          python3 eng/verify-sqlserver-integration.py verify
          --results TestResults/SqlServerIntegration
          --output artifacts/sqlserver-integration

      - name: Publish SQL Server integration summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/sqlserver-integration/SQLSERVER_INTEGRATION_SUMMARY.md ]]; then
            cat artifacts/sqlserver-integration/SQLSERVER_INTEGRATION_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## SQL Server integration" >> "$GITHUB_STEP_SUMMARY"
            echo "The integration summary could not be generated. Inspect the test and verifier steps." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SQL Server integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlserver-integration-${{ github.run_id }}
          path: |
            TestResults/SqlServerIntegration/**/*.trx
            TestResults/SqlServerIntegration/diagnostics/**
            artifacts/sqlserver-integration/SQLSERVER_INTEGRATION_SUMMARY.md
            artifacts/sqlserver-integration/sqlserver-integration-summary.json
            artifacts/sqlserver-integration/logs/**
            TestResults/ResilienceSqlServer/**
            artifacts/resilience/sqlserver-traces/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload sanitized container diagnostics on failure
        if: failure() || steps.integration-tests.outcome != 'success' || steps.verify-results.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: sqlserver-integration-diagnostics-${{ github.run_id }}
          path: TestResults/SqlServerIntegration/diagnostics/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up SQL Server integration containers
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter "label=tcj.sqlserver.integration=true" | xargs -r docker rm -f

      - name: Enforce SQL Server integration result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.integration-tests.outcome }}" != "success" ]]; then
            echo "SQL Server integration tests failed." >&2
            exit 1
          fi
          if [[ "${{ steps.verify-results.outcome }}" != "success" ]]; then
            echo "SQL Server integration result verification failed." >&2
            exit 1
          fi
