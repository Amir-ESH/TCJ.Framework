name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  mutation-scope:
    name: Detect mutation-testing changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect relevant mutation-testing changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi

          git diff --name-only "$base" "$HEAD_SHA" > changed-files.txt
          cat changed-files.txt

          if grep -Eq '^(\.config/dotnet-tools\.json|\.github/workflows/(ci|mutation-testing)\.yml|eng/(mutation-(policy|baseline)\.json|run-mutation-testing\.py|verify-mutation-results\.py|tests/test_(run_mutation_testing|verify_mutation_results)\.py)|stryker-config\.json|tests/TestProject\.props|src/TCJ\.(Core|DependencyInjection)/|tests/TCJ\.(Core|DependencyInjection)\.Tests/)' changed-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  mutation-testing:
    name: Mutation quality gate
    needs: mutation-scope
    if: ${{ needs.mutation-scope.outputs.run == 'true' }}
    uses: ./.github/workflows/mutation-testing.yml
    with:
      mode: verify

  build-test-pack:
    name: Build, test and pack
    needs: [mutation-scope, mutation-testing]
    if: >-
      ${{ always() &&
          needs.mutation-scope.result == 'success' &&
          (needs.mutation-testing.result == 'success' ||
           needs.mutation-testing.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Validate automation scripts
        run: python3 -m py_compile eng/*.py

      - name: Verify development metadata
        run: python3 eng/verify-release.py

      - name: Verify dependency security policy
        run: python3 eng/verify-dependency-security.py

      - name: Verify release integrity automation
        run: python3 eng/release-integrity.py validate-config

      - name: Verify code coverage policy
        run: python3 eng/verify-coverage.py validate-config

      - name: Verify mutation-testing configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            --start-directory eng/tests \
            --pattern "test_*.py"
          python3 eng/verify-mutation-results.py validate-config
          python3 eng/verify-mutation-results.py validate-baseline

      - name: Restore and audit dependencies
        run: dotnet restore TCJ.slnx

      - name: Build solution
        run: >
          dotnet build TCJ.slnx
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test TCJ.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/coverlet.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Enforce code coverage quality gate
        run: >
          python3 eng/verify-coverage.py verify
          --summary artifacts/coverage/COVERAGE_SUMMARY.md
          --json artifacts/coverage/coverage-summary.json

      - name: Publish code coverage summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/coverage/COVERAGE_SUMMARY.md ]]; then
            cat artifacts/coverage/COVERAGE_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pack and validate NuGet packages
        run: >
          dotnet pack TCJ.slnx
          --configuration Release
          --no-build

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          set -euo pipefail

          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("eng/Packaging.props").getroot()
          version = root.findtext("./PropertyGroup/Version")
          if not version:
              raise SystemExit("eng/Packaging.props does not define Version.")
          print(version.strip())
          PY
          )"

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify NuGet package set
        run: >
          bash eng/verify-packages.sh
          "${{ steps.package-version.outputs.value }}"

      - name: Inspect NuGet package metadata and contents
        run: >
          python3 eng/verify-release.py
          --package-directory artifacts/packages

      - name: Generate package checksums
        run: >
          python3 eng/release-integrity.py write
          --version "${{ steps.package-version.outputs.value }}"
          --package-directory artifacts/packages
          --checksums artifacts/release/SHA256SUMS

      - name: Verify package checksums
        run: >
          python3 eng/release-integrity.py verify
          --version "${{ steps.package-version.outputs.value }}"
          --package-directory artifacts/packages
          --checksums artifacts/release/SHA256SUMS

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: |
            TestResults/**/coverage.cobertura.xml
            artifacts/coverage/COVERAGE_SUMMARY.md
            artifacts/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ github.run_id }}
          path: |
            artifacts/packages/*
            artifacts/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

