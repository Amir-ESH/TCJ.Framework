name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore TCJ.slnx

      - name: Build solution
        run: >
          dotnet build TCJ.slnx
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test TCJ.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Pack NuGet packages
        run: >
          dotnet pack TCJ.slnx
          --configuration Release
          --no-build

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          set -euo pipefail

          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("eng/Packaging.props").getroot()
          version = root.findtext("./PropertyGroup/Version")
          if not version:
              raise SystemExit("eng/Packaging.props does not define Version.")
          print(version.strip())
          PY
          )"

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify NuGet package set
        run: >
          bash eng/verify-packages.sh
          "${{ steps.package-version.outputs.value }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ github.run_id }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 7
