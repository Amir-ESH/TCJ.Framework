name: Azure Service Bus transport

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 4"
  push:
    branches: [main, develop]
    paths:
      - "src/TCJ.Core/**"
      - "src/TCJ.Messaging/**"
      - "src/TCJ.Messaging.AzureServiceBus/**"
      - "src/TCJ.EntityFrameworkCore/**"
      - "src/TCJ.AspNetCore/**"
      - "tests/TCJ.Messaging.AzureServiceBus.Tests/**"
      - "tests/TCJ.Messaging.ConformanceTests/**"
      - "tests/TCJ.Concurrency.Tests/Tests/AzureServiceBusStressTests.cs"
      - "tests/TCJ.Concurrency.Tests/TCJ.Concurrency.Tests.csproj"
      - "tests/TCJ.Resilience.Tests/AzureServiceBusResilienceTests.cs"
      - "tests/TCJ.Resilience.Tests/TCJ.Resilience.Tests.csproj"
      - "tests/TCJ.Observability.Tests/AzureServiceBusTelemetryTests.cs"
      - "tests/TCJ.Observability.Tests/TCJ.Observability.Tests.csproj"
      - "tests/TCJ.HealthChecks.Tests/Tests/AzureServiceBusHealthCheckTests.cs"
      - "tests/TCJ.HealthChecks.Tests/TCJ.HealthChecks.Tests.csproj"
      - "benchmarks/TCJ.Benchmarks/Benchmarks/AzureServiceBusBenchmarks.cs"
      - "benchmarks/TCJ.Benchmarks/TCJ.Benchmarks.csproj"
      - "eng/azure-service-bus-policy.json"
      - "eng/azure-service-bus-contract.json"
      - "eng/azure-service-bus-emulator/**"
      - "eng/verify-azure-service-bus.py"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/azure-service-bus.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-preflight.yml"
      - ".github/workflows/release.yml"
      - "TCJ.slnx"
  pull_request:
    paths:
      - "src/TCJ.Core/**"
      - "src/TCJ.Messaging/**"
      - "src/TCJ.Messaging.AzureServiceBus/**"
      - "src/TCJ.EntityFrameworkCore/**"
      - "src/TCJ.AspNetCore/**"
      - "tests/TCJ.Messaging.AzureServiceBus.Tests/**"
      - "tests/TCJ.Messaging.ConformanceTests/**"
      - "tests/TCJ.Concurrency.Tests/Tests/AzureServiceBusStressTests.cs"
      - "tests/TCJ.Concurrency.Tests/TCJ.Concurrency.Tests.csproj"
      - "tests/TCJ.Resilience.Tests/AzureServiceBusResilienceTests.cs"
      - "tests/TCJ.Resilience.Tests/TCJ.Resilience.Tests.csproj"
      - "tests/TCJ.Observability.Tests/AzureServiceBusTelemetryTests.cs"
      - "tests/TCJ.Observability.Tests/TCJ.Observability.Tests.csproj"
      - "tests/TCJ.HealthChecks.Tests/Tests/AzureServiceBusHealthCheckTests.cs"
      - "tests/TCJ.HealthChecks.Tests/TCJ.HealthChecks.Tests.csproj"
      - "benchmarks/TCJ.Benchmarks/Benchmarks/AzureServiceBusBenchmarks.cs"
      - "benchmarks/TCJ.Benchmarks/TCJ.Benchmarks.csproj"
      - "eng/azure-service-bus-policy.json"
      - "eng/azure-service-bus-contract.json"
      - "eng/azure-service-bus-emulator/**"
      - "eng/verify-azure-service-bus.py"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/azure-service-bus.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-preflight.yml"
      - ".github/workflows/release.yml"
      - "TCJ.slnx"

permissions:
  contents: read

concurrency:
  group: azure-service-bus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  TCJ_AZURE_SERVICE_BUS_REQUIRE_INTEGRATION: 1
  TCJ_AZURE_SERVICE_BUS_TEST_ENVIRONMENT: emulator
  TCJ_AZURE_SERVICE_BUS_CONNECTION_STRING: Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
  TCJ_AZURE_SERVICE_BUS_MANAGEMENT_CONNECTION_STRING: Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;

jobs:
  conformance:
    name: Run adapter conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate automation scripts and Azure Service Bus contract
        run: |
          python3 -m py_compile eng/*.py
          python3 -m unittest discover --start-directory eng/tests --pattern "test_*.py"
          python3 eng/verify-azure-service-bus.py validate-config

      - name: Resolve pinned emulator images and disposable SQL password
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          policy = json.load(open("eng/azure-service-bus-policy.json", encoding="utf-8"))
          print(f"TCJ_SERVICE_BUS_EMULATOR_IMAGE={policy['emulator']['image']}")
          print(f"TCJ_SQL_SERVER_IMAGE={policy['emulator']['sqlServerImage']}")
          PY
          password="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SQL_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start pinned Azure Service Bus emulator
        run: docker compose -f eng/azure-service-bus-emulator/docker-compose.yml up -d

      - name: Wait for Azure Service Bus emulator readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://localhost:5300/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f eng/azure-service-bus-emulator/docker-compose.yml logs --no-color
          exit 1

      - name: Restore and audit adapter and conformance dependencies
        run: |
          dotnet restore tests/TCJ.Messaging.AzureServiceBus.Tests/TCJ.Messaging.AzureServiceBus.Tests.csproj --force-evaluate
          dotnet restore tests/TCJ.Messaging.ConformanceTests/TCJ.Messaging.ConformanceTests.csproj --force-evaluate

      - name: Build adapter tests and Step 46 conformance suite
        run: |
          dotnet build tests/TCJ.Messaging.AzureServiceBus.Tests/TCJ.Messaging.AzureServiceBus.Tests.csproj -c Release --no-restore
          dotnet build tests/TCJ.Messaging.ConformanceTests/TCJ.Messaging.ConformanceTests.csproj -c Release --no-restore

      - name: Run Step 46 messaging conformance suite
        run: >
          dotnet test tests/TCJ.Messaging.ConformanceTests/TCJ.Messaging.ConformanceTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=messaging-conformance.trx"
          --results-directory TestResults/AzureServiceBus/conformance

      - name: Run Azure Service Bus integration and adapter conformance scenarios
        run: >
          dotnet test tests/TCJ.Messaging.AzureServiceBus.Tests/TCJ.Messaging.AzureServiceBus.Tests.csproj
          -c Release --no-build
          --filter "Category=AzureServiceBusIntegration"
          --logger "trx;LogFileName=azure-service-bus-integration.trx"
          --results-directory TestResults/AzureServiceBus/integration

      - name: Verify Azure Service Bus evidence and sensitive-data policy
        run: >
          python3 eng/verify-azure-service-bus.py verify
          --results TestResults/AzureServiceBus
          --output artifacts/azure-service-bus

      - name: Publish Azure Service Bus summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/azure-service-bus/AZURE_SERVICE_BUS_SUMMARY.md ]]; then
            cat artifacts/azure-service-bus/AZURE_SERVICE_BUS_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Azure Service Bus test results and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azure-service-bus-conformance-${{ github.run_id }}
          path: |
            TestResults/AzureServiceBus/**
            artifacts/azure-service-bus/**
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Azure Service Bus emulator
        if: always()
        run: docker compose -f eng/azure-service-bus-emulator/docker-compose.yml down -v --remove-orphans

  inbox-outbox:
    name: Validate Inbox and Outbox
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate Azure Service Bus policy and contract
        run: python3 eng/verify-azure-service-bus.py validate-config
      - name: Resolve pinned emulator images and disposable SQL password
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          policy = json.load(open("eng/azure-service-bus-policy.json", encoding="utf-8"))
          print(f"TCJ_SERVICE_BUS_EMULATOR_IMAGE={policy['emulator']['image']}")
          print(f"TCJ_SQL_SERVER_IMAGE={policy['emulator']['sqlServerImage']}")
          PY
          password="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SQL_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start pinned Azure Service Bus emulator
        run: docker compose -f eng/azure-service-bus-emulator/docker-compose.yml up -d
      - name: Wait for Azure Service Bus emulator readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            curl --fail --silent http://localhost:5300/health >/dev/null && exit 0
            sleep 2
          done
          docker compose -f eng/azure-service-bus-emulator/docker-compose.yml logs --no-color
          exit 1
      - name: Restore and build Azure Service Bus tests
        run: |
          dotnet restore tests/TCJ.Messaging.AzureServiceBus.Tests/TCJ.Messaging.AzureServiceBus.Tests.csproj --force-evaluate
          dotnet build tests/TCJ.Messaging.AzureServiceBus.Tests/TCJ.Messaging.AzureServiceBus.Tests.csproj -c Release --no-restore
      - name: Run Inbox and Outbox integration tests
        run: >
          dotnet test tests/TCJ.Messaging.AzureServiceBus.Tests/TCJ.Messaging.AzureServiceBus.Tests.csproj
          -c Release --no-build
          --filter "Category=AzureServiceBusIntegration&(FullyQualifiedName~Inbox|FullyQualifiedName~Outbox)"
          --logger "trx;LogFileName=azure-service-bus-inbox-outbox.trx"
          --results-directory TestResults/AzureServiceBus/inbox-outbox
      - name: Upload Inbox and Outbox results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azure-service-bus-inbox-outbox-${{ github.run_id }}
          path: TestResults/AzureServiceBus/inbox-outbox/**
          if-no-files-found: warn
          retention-days: 30
      - name: Stop Azure Service Bus emulator
        if: always()
        run: docker compose -f eng/azure-service-bus-emulator/docker-compose.yml down -v --remove-orphans

  sessions-settlement:
    name: Validate sessions and settlement
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate Azure Service Bus policy and contract
        run: python3 eng/verify-azure-service-bus.py validate-config
      - name: Resolve pinned emulator images and disposable SQL password
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          policy = json.load(open("eng/azure-service-bus-policy.json", encoding="utf-8"))
          print(f"TCJ_SERVICE_BUS_EMULATOR_IMAGE={policy['emulator']['image']}")
          print(f"TCJ_SQL_SERVER_IMAGE={policy['emulator']['sqlServerImage']}")
          PY
          password="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SQL_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start pinned Azure Service Bus emulator
        run: docker compose -f eng/azure-service-bus-emulator/docker-compose.yml up -d
      - name: Wait for Azure Service Bus emulator readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            curl --fail --silent http://localhost:5300/health >/dev/null && exit 0
            sleep 2
          done
          docker compose -f eng/azure-service-bus-emulator/docker-compose.yml logs --no-color
          exit 1
      - name: Restore and build Azure Service Bus tests
        run: |
          dotnet restore tests/TCJ.Messaging.AzureServiceBus.Tests/TCJ.Messaging.AzureServiceBus.Tests.csproj --force-evaluate
          dotnet build tests/TCJ.Messaging.AzureServiceBus.Tests/TCJ.Messaging.AzureServiceBus.Tests.csproj -c Release --no-restore
      - name: Run session, Peek-Lock, settlement and shutdown tests
        run: >
          dotnet test tests/TCJ.Messaging.AzureServiceBus.Tests/TCJ.Messaging.AzureServiceBus.Tests.csproj
          -c Release --no-build
          --filter "Category=AzureServiceBusIntegration&(FullyQualifiedName~Session|FullyQualifiedName~PeekLock|FullyQualifiedName~manual_completion|FullyQualifiedName~Abandon|FullyQualifiedName~DeadLetter|FullyQualifiedName~Defer|FullyQualifiedName~lock_|FullyQualifiedName~Graceful|FullyQualifiedName~Scheduled)"
          --logger "trx;LogFileName=azure-service-bus-sessions-settlement.trx"
          --results-directory TestResults/AzureServiceBus/sessions-settlement
      - name: Upload session and settlement results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azure-service-bus-sessions-settlement-${{ github.run_id }}
          path: TestResults/AzureServiceBus/sessions-settlement/**
          if-no-files-found: warn
          retention-days: 30
      - name: Stop Azure Service Bus emulator
        if: always()
        run: docker compose -f eng/azure-service-bus-emulator/docker-compose.yml down -v --remove-orphans
