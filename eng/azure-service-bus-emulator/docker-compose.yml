name: tcj-azure-service-bus-emulator

services:
  emulator:
    image: ${TCJ_SERVICE_BUS_EMULATOR_IMAGE:?TCJ_SERVICE_BUS_EMULATOR_IMAGE is required}
    pull_policy: always
    volumes:
      - ./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}
      ACCEPT_EULA: "Y"
      SQL_WAIT_INTERVAL: "5"
      EMULATOR_HTTP_PORT: "5300"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - servicebus

  sqlserver:
    image: ${TCJ_SQL_SERVER_IMAGE:?TCJ_SQL_SERVER_IMAGE is required}
    pull_policy: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?SQL_PASSWORD is required}
      MSSQL_PID: Express
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null 2>&1
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - servicebus

networks:
  servicebus:
